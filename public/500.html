<!doctype html>
<html lang="nl" data-theme="night">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Storing — LUMI</title>
  <meta name="theme-color" content="#0d0c0a">
  <link rel="icon" href="/assets/favicon-64.png" type="image/png" sizes="64x64">
  <link rel="stylesheet" href="/assets/css/fonts.css">
  <link rel="stylesheet" href="/assets/css/error.css">
  <script src="/assets/js/error-page.js" defer></script>
</head>
<body class="err err--500">
  <a class="err__brand" href="/">LUMI</a>
  <main class="err__main">
    <div class="err__lamp err__lamp--flicker" aria-hidden="true">
      <span class="err__halo"></span>
      <img src="/assets/logo-lamp.webp" alt="" width="640" height="402">
    </div>
    <p class="err__code">500</p>
    <h1 class="err__title" data-nl="Even geen stroom." data-en="A brief power cut."></h1>
    <p class="err__text" data-nl="Er ging iets mis aan onze kant. Probeer het over een minuutje opnieuw — je winkelmand blijft bewaard." data-en="Something went wrong on our side. Please try again in a minute — your cart is kept safe."></p>
    <div class="err__actions">
      <button class="err__btn" type="button" id="retry" data-nl="Opnieuw proberen" data-en="Try again"></button>
      <a class="err__btn err__btn--line" href="/" data-nl="Naar de homepage" data-en="Go to the homepage"></a>
    </div>
  </main>

</html>
