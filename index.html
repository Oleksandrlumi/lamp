<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LUMI — 3D-geprinte designlampen</title>
  <meta name="description" content="Sculpturale lampen, op bestelling 3D-geprint uit plantaardig PLA. Kies je kleur. Gratis verzending in Nederland, 10% korting op je eerste bestelling.">
  <meta name="theme-color" content="#f3f0ea">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="preload" href="assets/fonts/instrument-serif-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="assets/css/fonts.css">
  <link rel="stylesheet" href="assets/css/style.css">
  <script type="module" src="assets/js/main.js"></script>
</head>
<body>
  <div class="announce">
    <span data-i18n="bar.discount"></span>
    <span class="announce__sep" aria-hidden="true"></span>
    <span data-i18n="bar.shipping"></span>
  </div>

  <header class="nav" id="nav">
    <nav class="nav__links">
      <a href="#collection" data-i18n="nav.collection"></a>
      <a href="#process" data-i18n="nav.process"></a>
      <a href="#faq" data-i18n="nav.faq"></a>
    </nav>
    <a class="logo" href="#top">LUMI</a>
    <div class="nav__actions">
      <div class="lang" role="group" aria-label="Language">
        <button type="button" data-lang="nl">NL</button>
        <button type="button" data-lang="en">EN</button>
        <button type="button" data-lang="uk">UA</button>
      </div>
      <button class="cart-btn" type="button" id="cartOpen">
        <span data-i18n="nav.cart"></span>
        <span class="cart-btn__count" id="cartCount">0</span>
      </button>
    </div>
  </header>

  <main id="top">
    <section class="hero">
      <p class="eyebrow" data-i18n="hero.eyebrow"></p>
      <h1 class="hero__title" data-i18n-html="hero.title"></h1>
      <div class="hero__row">
        <p class="hero__lead" data-i18n="hero.lead"></p>
        <div class="hero__ctas">
          <a class="btn btn--dark" href="#collection"><span data-i18n="hero.cta"></span><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6" fill="none" stroke="currentColor" stroke-width="1.4"/></svg></a>
          <a class="btn btn--line" href="#process" data-i18n="hero.cta2"></a>
        </div>
      </div>
    </section>

    <section class="palette" aria-labelledby="paletteTitle">
      <div class="palette__head">
        <p class="palette__title" id="paletteTitle" data-i18n="hero.try"></p>
        <p class="palette__hint" data-i18n="hero.drag"></p>
      </div>
      <div class="palette__bands" id="palette"></div>
    </section>

    <section class="offers">
      <article class="offer">
        <span class="offer__num">−10%</span>
        <h3 data-i18n="offer.first.title"></h3>
        <p data-i18n="offer.first.text"></p>
      </article>
      <article class="offer">
        <span class="offer__num">€ 0</span>
        <h3 data-i18n="offer.ship.title"></h3>
        <p data-i18n="offer.ship.text"></p>
      </article>
      <article class="offer">
        <span class="offer__num">10</span>
        <h3 data-i18n="offer.colour.title"></h3>
        <p data-i18n="offer.colour.text"></p>
      </article>
    </section>

    <section class="collection" id="collection">
      <header class="section-head">
        <p class="eyebrow" data-i18n="collection.eyebrow"></p>
        <h2 data-i18n-html="collection.title"></h2>
        <p class="section-head__lead" data-i18n="collection.lead"></p>
      </header>
      <div class="grid" id="productGrid"></div>
    </section>

    <section class="process" id="process">
      <header class="section-head">
        <p class="eyebrow" data-i18n="process.eyebrow"></p>
        <h2 data-i18n-html="process.title"></h2>
      </header>
      <ol class="steps">
        <li class="step"><span class="step__num">01</span><h3 data-i18n="process.1.title"></h3><p data-i18n="process.1.text"></p></li>
        <li class="step"><span class="step__num">02</span><h3 data-i18n="process.2.title"></h3><p data-i18n="process.2.text"></p></li>
        <li class="step"><span class="step__num">03</span><h3 data-i18n="process.3.title"></h3><p data-i18n="process.3.text"></p></li>
      </ol>
    </section>

    <section class="faq" id="faq">
      <header class="section-head">
        <p class="eyebrow" data-i18n="faq.eyebrow"></p>
        <h2 data-i18n-html="faq.title"></h2>
      </header>
      <div class="faq__list">
        <details><summary data-i18n="faq.1.q"></summary><p data-i18n="faq.1.a"></p></details>
        <details><summary data-i18n="faq.2.q"></summary><p data-i18n="faq.2.a"></p></details>
        <details><summary data-i18n="faq.3.q"></summary><p data-i18n="faq.3.a"></p></details>
        <details><summary data-i18n="faq.4.q"></summary><p data-i18n="faq.4.a"></p></details>
      </div>
    </section>
  </main>

  <footer class="footer">
    <div class="footer__cols">
      <p class="footer__tagline" data-i18n="footer.tagline"></p>
      <div>
        <p class="footer__head" data-i18n="footer.shop"></p>
        <a href="#collection" data-i18n="nav.collection"></a>
        <a href="#process" data-i18n="nav.process"></a>
      </div>
      <div>
        <p class="footer__head" data-i18n="footer.help"></p>
        <a href="#faq" data-i18n="footer.shipping"></a>
        <a href="mailto:hello@lumi.example" data-i18n="footer.contact"></a>
      </div>
    </div>
    <p class="footer__logo" aria-hidden="true">LUMI</p>
    <p class="footer__legal">© <span id="year"></span> LUMI · <span data-i18n="footer.rights"></span></p>
  </footer>

  <!-- Product detail -->
  <dialog class="modal configurator" id="configurator">
    <div class="configurator__visual" id="cfgVisual"></div>
    <div class="configurator__panel">
      <button class="icon-btn configurator__close" type="button" data-close data-i18n-aria="cfg.close">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18" stroke="currentColor" stroke-width="1.4"/></svg>
      </button>
      <p class="eyebrow" id="cfgType"></p>
      <h2 class="configurator__name" id="cfgName"></h2>
      <p class="configurator__tagline" id="cfgTagline"></p>
      <p class="configurator__price"><span id="cfgPrice"></span><small data-i18n="cfg.firstorder"></small></p>

      <div class="field-group">
        <div class="field-group__head"><span data-i18n="cfg.colour"></span><span class="muted" id="cfgColourName"></span></div>
        <div class="swatches swatches--lg" id="cfgSwatches"></div>
      </div>

      <div class="field-group">
        <div class="field-group__head"><span data-i18n="cfg.size"></span><span class="muted" id="cfgDims"></span></div>
        <div class="segmented" id="cfgSizes"></div>
      </div>

      <div class="configurator__buy">
        <div class="qty">
          <button type="button" id="cfgMinus" aria-label="−">−</button>
          <span id="cfgQty">1</span>
          <button type="button" id="cfgPlus" aria-label="+">+</button>
        </div>
        <button class="btn btn--dark btn--block" type="button" id="cfgAdd"><span data-i18n="cfg.add"></span><span class="btn__sep">—</span><span id="cfgTotal"></span></button>
      </div>
      <p class="configurator__note" data-i18n="cfg.note"></p>

      <details class="specs">
        <summary data-i18n="cfg.specs"></summary>
        <dl id="cfgSpecs"></dl>
      </details>
    </div>
  </dialog>

  <!-- Cart drawer -->
  <dialog class="drawer" id="cart">
    <div class="drawer__head">
      <h2 data-i18n="cart.title"></h2>
      <button class="icon-btn" type="button" data-close data-i18n-aria="cfg.close">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18" stroke="currentColor" stroke-width="1.4"/></svg>
      </button>
    </div>
    <div class="drawer__body" id="cartItems"></div>
    <div class="drawer__foot" id="cartFoot"></div>
  </dialog>

  <!-- Checkout -->
  <dialog class="modal checkout" id="checkout">
    <form class="checkout__form" id="checkoutForm" novalidate>
      <div class="checkout__head">
        <h2 data-i18n="co.title"></h2>
        <button class="icon-btn" type="button" data-close data-i18n-aria="cfg.close">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18" stroke="currentColor" stroke-width="1.4"/></svg>
        </button>
      </div>

      <fieldset>
        <legend data-i18n="co.contact"></legend>
        <label class="field field--full"><span data-i18n="co.email"></span><input name="email" type="email" autocomplete="email" required><em class="field__error"></em></label>
        <label class="field"><span data-i18n="co.firstname"></span><input name="firstName" autocomplete="given-name" required><em class="field__error"></em></label>
        <label class="field"><span data-i18n="co.lastname"></span><input name="lastName" autocomplete="family-name" required><em class="field__error"></em></label>
        <label class="field field--full"><span data-i18n="co.phone"></span><input name="phone" type="tel" autocomplete="tel"></label>
      </fieldset>

      <fieldset>
        <legend data-i18n="co.address"></legend>
        <label class="field field--full"><span data-i18n="co.country"></span>
          <select name="country" autocomplete="country">
            <option value="NL" data-i18n="country.NL"></option>
            <option value="BE" data-i18n="country.BE"></option>
            <option value="DE" data-i18n="country.DE"></option>
            <option value="LU" data-i18n="country.LU"></option>
            <option value="FR" data-i18n="country.FR"></option>
            <option value="AT" data-i18n="country.AT"></option>
          </select>
        </label>
        <p class="checkout__hint" id="autofillHint" data-i18n="co.autofill"></p>
        <label class="field field--third field--pc"><span data-i18n="co.postcode"></span><input name="postcode" autocomplete="postal-code" required placeholder="1234 AB"><em class="field__error"></em></label>
        <label class="field field--third"><span data-i18n="co.housenr"></span><input name="houseNumber" inputmode="numeric" required><em class="field__error"></em></label>
        <label class="field field--third"><span data-i18n="co.addition"></span><input name="addition" list="additionList" autocomplete="off"><datalist id="additionList"></datalist></label>
        <p class="lookup" id="lookupStatus" role="status" aria-live="polite"></p>
        <label class="field field--full"><span data-i18n="co.street"></span><input name="street" autocomplete="address-line1" required><em class="field__error"></em></label>
        <label class="field field--full"><span data-i18n="co.city"></span><input name="city" autocomplete="address-level2" required><em class="field__error"></em></label>
      </fieldset>
    </form>

    <aside class="checkout__summary">
      <h3 data-i18n="co.summary"></h3>
      <ul class="summary-items" id="summaryItems"></ul>
      <dl class="totals" id="summaryTotals"></dl>
      <p class="checkout__notice" id="discountNotice" hidden></p>
      <button class="btn btn--dark btn--block" type="submit" form="checkoutForm" id="placeOrder" data-i18n="co.place"></button>
    </aside>

    <div class="checkout__done" id="checkoutDone" hidden>
      <div class="done-mark"><svg viewBox="0 0 48 48" aria-hidden="true"><circle cx="24" cy="24" r="22" fill="none" stroke="currentColor" stroke-width="1"/><path d="M15 25l6 6 12-14" fill="none" stroke="currentColor" stroke-width="1.4"/></svg></div>
      <h2 data-i18n="co.done.title"></h2>
      <p id="doneText"></p>
      <p class="muted" id="doneSaved"></p>
      <button class="btn btn--dark" type="button" data-close data-i18n="co.done.close"></button>
    </div>
  </dialog>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
</body>
</html>
