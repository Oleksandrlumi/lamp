<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LUMI — 3D-geprinte designlampen</title>
  <meta name="description" content="Sculpturale lampen, parametrisch ontworpen en op bestelling 3D-geprint uit plantaardig PLA. Kies je kleur. Gratis verzending in Nederland, 10% korting op je eerste bestelling.">
  <meta name="theme-color" content="#0e0d0b">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;1,9..144,300;1,9..144,400&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
  <script type="importmap">
    {
      "imports": {
        "three": "./vendor/three/three.module.min.js",
        "three/addons/": "./vendor/three/addons/"
      }
    }
  </script>
  <script type="module" src="assets/js/main.js"></script>
</head>
<body>
  <div class="announce" aria-label="Aanbiedingen">
    <div class="announce__track">
      <span data-i18n="bar.discount"></span><i>✦</i>
      <span data-i18n="bar.shipping"></span><i>✦</i>
      <span data-i18n="bar.made"></span><i>✦</i>
      <span data-i18n="bar.pla"></span><i>✦</i>
      <span data-i18n="bar.discount" aria-hidden="true"></span><i>✦</i>
      <span data-i18n="bar.shipping" aria-hidden="true"></span><i>✦</i>
      <span data-i18n="bar.made" aria-hidden="true"></span><i>✦</i>
      <span data-i18n="bar.pla" aria-hidden="true"></span><i>✦</i>
    </div>
  </div>

  <header class="nav" id="nav">
    <a class="logo" href="#top" aria-label="LUMI">
      <svg viewBox="0 0 32 32" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-width="1.4"><path d="M9 26h14"/><path d="M11 24c-3-3-4-7-3-11 1-4 4-7 8-7s7 3 8 7c1 4 0 8-3 11"/><path d="M12 10h8M10.5 14h11M10.5 18h11M12 22h8" opacity=".55"/></g></svg>
      <span>LUMI</span>
    </a>
    <nav class="nav__links">
      <a href="#collection" data-i18n="nav.collection"></a>
      <a href="#process" data-i18n="nav.process"></a>
      <a href="#faq" data-i18n="nav.faq"></a>
    </nav>
    <div class="nav__actions">
      <div class="lang" role="group" aria-label="Language">
        <button type="button" data-lang="nl">NL</button>
        <button type="button" data-lang="en">EN</button>
        <button type="button" data-lang="uk">UA</button>
      </div>
      <button class="cart-btn" type="button" id="cartOpen" data-i18n-aria="nav.cart">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 8h14l-1.2 11.2a2 2 0 0 1-2 1.8H8.2a2 2 0 0 1-2-1.8L5 8Z" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M9 8V6.5a3 3 0 0 1 6 0V8" fill="none" stroke="currentColor" stroke-width="1.5"/></svg>
        <span class="cart-btn__count" id="cartCount">0</span>
      </button>
    </div>
  </header>

  <main id="top">
    <section class="hero">
      <div class="hero__copy">
        <p class="eyebrow" data-i18n="hero.eyebrow"></p>
        <h1 class="hero__title" data-i18n-html="hero.title"></h1>
        <p class="hero__lead" data-i18n="hero.lead"></p>
        <div class="hero__ctas">
          <a class="btn btn--primary" href="#collection"><span data-i18n="hero.cta"></span><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6" fill="none" stroke="currentColor" stroke-width="1.6"/></svg></a>
          <a class="btn btn--ghost" href="#process" data-i18n="hero.cta2"></a>
        </div>
        <dl class="stats">
          <div><dt>0,2 mm</dt><dd data-i18n="stat.layer"></dd></div>
          <div><dt>100%</dt><dd data-i18n="stat.pla"></dd></div>
          <div><dt>3–5</dt><dd data-i18n="stat.days"></dd></div>
        </dl>
      </div>

      <div class="hero__stage" id="heroStage">
        <div class="hero__glow" aria-hidden="true"></div>
        <div class="hero__rings" aria-hidden="true"></div>
        <canvas id="heroCanvas" aria-label="3D lamp"></canvas>
        <div class="hero__fallback" aria-hidden="true"></div>
        <p class="hero__hint" data-i18n="hero.drag"></p>
        <div class="hero__panel">
          <div class="hero__panel-head">
            <div>
              <p class="hero__product" id="heroProduct">Nova</p>
              <p class="hero__colour" id="heroColour"></p>
            </div>
            <button class="btn btn--small" type="button" id="heroConfigure" data-i18n="hero.configure"></button>
          </div>
          <p class="hero__try" data-i18n="hero.try"></p>
          <div class="swatches swatches--hero" id="heroSwatches"></div>
        </div>
      </div>
    </section>

    <section class="offers" aria-label="Voordelen">
      <article class="offer">
        <span class="offer__icon">−10%</span>
        <div><h3 data-i18n="offer.first.title"></h3><p data-i18n="offer.first.text"></p></div>
      </article>
      <article class="offer">
        <span class="offer__icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 7h11v9H3zM14 10h4l3 3v3h-7z" fill="none" stroke="currentColor" stroke-width="1.4"/><circle cx="7" cy="17.5" r="1.6" fill="none" stroke="currentColor" stroke-width="1.4"/><circle cx="17" cy="17.5" r="1.6" fill="none" stroke="currentColor" stroke-width="1.4"/></svg></span>
        <div><h3 data-i18n="offer.ship.title"></h3><p data-i18n="offer.ship.text"></p></div>
      </article>
      <article class="offer">
        <span class="offer__icon offer__icon--dots" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
        <div><h3 data-i18n="offer.colour.title"></h3><p data-i18n="offer.colour.text"></p></div>
      </article>
    </section>

    <section class="collection" id="collection">
      <header class="section-head">
        <p class="eyebrow" data-i18n="collection.eyebrow"></p>
        <h2 data-i18n-html="collection.title"></h2>
        <p class="section-head__lead" data-i18n="collection.lead"></p>
      </header>
      <div class="grid" id="productGrid"></div>
    </section>

    <section class="process" id="process">
      <header class="section-head">
        <p class="eyebrow" data-i18n="process.eyebrow"></p>
        <h2 data-i18n-html="process.title"></h2>
      </header>
      <ol class="steps">
        <li class="step">
          <span class="step__num">01</span>
          <svg class="step__art" viewBox="0 0 120 80" aria-hidden="true"><path d="M4 60 C 24 10, 44 10, 60 40 S 96 70, 116 20" fill="none" stroke="currentColor" stroke-width="1.2"/><g fill="currentColor"><circle cx="4" cy="60" r="2.5"/><circle cx="60" cy="40" r="2.5"/><circle cx="116" cy="20" r="2.5"/></g><path d="M24 10 L4 60 M44 10 L60 40 M76 70 L60 40 M96 70 L116 20" stroke="currentColor" stroke-width=".6" stroke-dasharray="2 3" opacity=".6"/></svg>
          <h3 data-i18n="process.1.title"></h3>
          <p data-i18n="process.1.text"></p>
        </li>
        <li class="step">
          <span class="step__num">02</span>
          <svg class="step__art" viewBox="0 0 120 80" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-width="1"><path d="M36 74h48"/><path d="M38 70h44"/><path d="M40 66h40"/><path d="M41 62h38"/><path d="M42 58h36"/><path d="M42 54h36"/><path d="M41 50h38"/><path d="M40 46h40"/><path d="M38 42h44" opacity=".7"/><path d="M36 38h48" opacity=".45"/><path d="M34 34h52" opacity=".25"/></g><path d="M60 8v20" stroke="currentColor" stroke-width="1.2"/><path d="M54 8h12l-6 8z" fill="currentColor"/></svg>
          <h3 data-i18n="process.2.title"></h3>
          <p data-i18n="process.2.text"></p>
        </li>
        <li class="step">
          <span class="step__num">03</span>
          <svg class="step__art" viewBox="0 0 120 80" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-width="1.1"><path d="M30 34 L60 20 L90 34 L60 48 Z"/><path d="M30 34 V60 L60 74 V48"/><path d="M90 34 V60 L60 74"/><path d="M45 27 L75 41" opacity=".6"/></g></svg>
          <h3 data-i18n="process.3.title"></h3>
          <p data-i18n="process.3.text"></p>
        </li>
      </ol>
    </section>

    <section class="faq" id="faq">
      <header class="section-head">
        <p class="eyebrow" data-i18n="faq.eyebrow"></p>
        <h2 data-i18n-html="faq.title"></h2>
      </header>
      <div class="faq__list">
        <details><summary data-i18n="faq.1.q"></summary><p data-i18n="faq.1.a"></p></details>
        <details><summary data-i18n="faq.2.q"></summary><p data-i18n="faq.2.a"></p></details>
        <details><summary data-i18n="faq.3.q"></summary><p data-i18n="faq.3.a"></p></details>
        <details><summary data-i18n="faq.4.q"></summary><p data-i18n="faq.4.a"></p></details>
      </div>
    </section>
  </main>

  <footer class="footer">
    <div class="footer__brand">
      <p class="footer__logo">LUMI</p>
      <p data-i18n="footer.tagline"></p>
    </div>
    <div>
      <p class="footer__head" data-i18n="footer.shop"></p>
      <a href="#collection" data-i18n="nav.collection"></a>
      <a href="#process" data-i18n="nav.process"></a>
    </div>
    <div>
      <p class="footer__head" data-i18n="footer.help"></p>
      <a href="#faq" data-i18n="footer.shipping"></a>
      <a href="mailto:hello@lumi.example" data-i18n="footer.contact"></a>
    </div>
    <p class="footer__legal">© <span id="year"></span> LUMI · <span data-i18n="footer.rights"></span></p>
  </footer>

  <!-- Product configurator -->
  <dialog class="modal configurator" id="configurator">
    <div class="configurator__stage">
      <canvas id="cfgCanvas" aria-label="3D lamp"></canvas>
      <div class="configurator__fallback" aria-hidden="true"></div>
      <div class="light-toggle" role="group">
        <span data-i18n="cfg.light"></span>
        <button type="button" id="cfgLight" aria-pressed="true"><i></i><b data-i18n="cfg.on"></b></button>
      </div>
      <p class="configurator__hint" data-i18n="hero.drag"></p>
    </div>
    <div class="configurator__panel">
      <button class="icon-btn configurator__close" type="button" data-close data-i18n-aria="cfg.close">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18" stroke="currentColor" stroke-width="1.6"/></svg>
      </button>
      <p class="eyebrow" id="cfgType"></p>
      <h2 class="configurator__name" id="cfgName"></h2>
      <p class="configurator__tagline" id="cfgTagline"></p>
      <p class="configurator__price"><span id="cfgPrice"></span><small data-i18n="cfg.firstorder"></small></p>

      <div class="field-group">
        <div class="field-group__head"><span data-i18n="cfg.colour"></span><span class="muted" id="cfgColourName"></span></div>
        <div class="swatches" id="cfgSwatches"></div>
      </div>

      <div class="field-group">
        <div class="field-group__head"><span data-i18n="cfg.size"></span><span class="muted" id="cfgDims"></span></div>
        <div class="segmented" id="cfgSizes"></div>
      </div>

      <div class="configurator__buy">
        <div class="qty" aria-label="Aantal">
          <button type="button" id="cfgMinus" aria-label="−">−</button>
          <span id="cfgQty">1</span>
          <button type="button" id="cfgPlus" aria-label="+">+</button>
        </div>
        <button class="btn btn--primary btn--block" type="button" id="cfgAdd"><span data-i18n="cfg.add"></span> · <span id="cfgTotal"></span></button>
      </div>
      <p class="configurator__note" data-i18n="cfg.note"></p>

      <details class="specs" open>
        <summary data-i18n="cfg.specs"></summary>
        <dl id="cfgSpecs"></dl>
      </details>
    </div>
  </dialog>

  <!-- Cart drawer -->
  <dialog class="drawer" id="cart">
    <div class="drawer__head">
      <h2 data-i18n="cart.title"></h2>
      <button class="icon-btn" type="button" data-close data-i18n-aria="cfg.close">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18" stroke="currentColor" stroke-width="1.6"/></svg>
      </button>
    </div>
    <div class="drawer__body" id="cartItems"></div>
    <div class="drawer__foot" id="cartFoot"></div>
  </dialog>

  <!-- Checkout -->
  <dialog class="modal checkout" id="checkout">
    <form class="checkout__form" id="checkoutForm" novalidate>
      <div class="checkout__head">
        <h2 data-i18n="co.title"></h2>
        <button class="icon-btn" type="button" data-close data-i18n-aria="cfg.close">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18" stroke="currentColor" stroke-width="1.6"/></svg>
        </button>
      </div>

      <fieldset>
        <legend data-i18n="co.contact"></legend>
        <label class="field field--full"><span data-i18n="co.email"></span><input name="email" type="email" autocomplete="email" required><em class="field__error"></em></label>
        <label class="field"><span data-i18n="co.firstname"></span><input name="firstName" autocomplete="given-name" required><em class="field__error"></em></label>
        <label class="field"><span data-i18n="co.lastname"></span><input name="lastName" autocomplete="family-name" required><em class="field__error"></em></label>
        <label class="field field--full"><span data-i18n="co.phone"></span><input name="phone" type="tel" autocomplete="tel"></label>
      </fieldset>

      <fieldset>
        <legend data-i18n="co.address"></legend>
        <label class="field field--full"><span data-i18n="co.country"></span>
          <select name="country" autocomplete="country">
            <option value="NL" data-i18n="country.NL"></option>
            <option value="BE" data-i18n="country.BE"></option>
            <option value="DE" data-i18n="country.DE"></option>
            <option value="LU" data-i18n="country.LU"></option>
            <option value="FR" data-i18n="country.FR"></option>
            <option value="AT" data-i18n="country.AT"></option>
          </select>
        </label>
        <p class="checkout__hint" id="autofillHint" data-i18n="co.autofill"></p>
        <label class="field field--third field--pc"><span data-i18n="co.postcode"></span><input name="postcode" autocomplete="postal-code" required placeholder="1234 AB"><em class="field__error"></em></label>
        <label class="field field--third"><span data-i18n="co.housenr"></span><input name="houseNumber" inputmode="numeric" required><em class="field__error"></em></label>
        <label class="field field--third"><span data-i18n="co.addition"></span><input name="addition" list="additionList" autocomplete="off"><datalist id="additionList"></datalist></label>
        <p class="lookup" id="lookupStatus" role="status" aria-live="polite"></p>
        <label class="field field--full"><span data-i18n="co.street"></span><input name="street" autocomplete="address-line1" required><em class="field__error"></em></label>
        <label class="field field--full"><span data-i18n="co.city"></span><input name="city" autocomplete="address-level2" required><em class="field__error"></em></label>
      </fieldset>
    </form>

    <aside class="checkout__summary">
      <h3 data-i18n="co.summary"></h3>
      <ul class="summary-items" id="summaryItems"></ul>
      <dl class="totals" id="summaryTotals"></dl>
      <p class="checkout__notice" id="discountNotice" hidden></p>
      <button class="btn btn--primary btn--block" type="submit" form="checkoutForm" id="placeOrder" data-i18n="co.place"></button>
    </aside>

    <div class="checkout__done" id="checkoutDone" hidden>
      <div class="done-mark"><svg viewBox="0 0 48 48" aria-hidden="true"><circle cx="24" cy="24" r="22" fill="none" stroke="currentColor" stroke-width="1.2"/><path d="M14 25l7 7 13-15" fill="none" stroke="currentColor" stroke-width="1.8"/></svg></div>
      <h2 data-i18n="co.done.title"></h2>
      <p id="doneText"></p>
      <p class="muted" id="doneSaved"></p>
      <button class="btn btn--primary" type="button" data-close data-i18n="co.done.close"></button>
    </div>
  </dialog>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
</body>
</html>
